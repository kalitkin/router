name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force full deploy'
        type: boolean
        default: false

concurrency:
  group: deploy-router
  cancel-in-progress: false

jobs:

  # ── Определяем что изменилось ──────────────────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      bypass:     ${{ steps.filter.outputs.bypass }}
      ipk:        ${{ steps.filter.outputs.ipk }}
      go_source:  ${{ steps.filter.outputs.go_source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bypass:
              - 'files/bypass_ips.txt'
              - 'files/bypass_domains.txt'
            ipk:
              - 'files/vpn-connect.sh'
              - 'files/vpn-bootstrap.sh'
              - 'files/vpnd.init'
              - 'files/sing-box.init'
              - 'files/vpn.lua'
              - 'files/index.htm'
              - 'files/cgi-vpn'
              - 'patch-ipk.sh'
              - 'files/keenetic-install.sh'
              - 'files/S99vpnd'
              - 'files/sing-box-init'
              - 'files/vpn-connect-keenetic.sh'
            go_source:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'build.sh'

  # ── ShellCheck ─────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck --severity=warning \
            patch-ipk.sh \
            files/vpn-connect.sh \
            files/vpn-bootstrap.sh \
            files/deploy.sh \
            files/deploy-vpnd.sh \
            files/vpn-connect-keenetic.sh \
            files/S99vpnd \
            files/sing-box-init \
            files/ndm-vpnd.sh \
            files/keenetic-install.sh \
            files/cgi-vpn

  # ── Go: тесты + vet ────────────────────────────────────────────────────────
  test-go:
    needs: detect
    if: needs.detect.outputs.go_source == 'true' || inputs.force_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # ── Go: кросс-компиляция для всех OpenWrt архитектур ──────────────────────
  build-go:
    needs: [detect, test-go]
    if: needs.detect.outputs.go_source == 'true' || inputs.force_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build all architectures
        run: |
          chmod +x build.sh
          ./build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: vpnd-binaries
          path: dist/
          retention-days: 7

  # ── IPK: сборка (только при изменении shell-файлов) ───────────────────────
  build-ipk:
    needs: detect
    if: needs.detect.outputs.ipk == 'true' || inputs.force_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPK
        run: bash patch-ipk.sh "$RUNNER_TEMP/router.ipk"
      - uses: actions/upload-artifact@v4
        with:
          name: router-ipk
          path: ${{ runner.temp }}/router.ipk
          retention-days: 7

  # ── Деплой на сервер ───────────────────────────────────────────────────────
  deploy:
    needs: [detect, lint, test-go, build-go, build-ipk]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (needs.test-go.result == 'success' || needs.test-go.result == 'skipped') &&
      (needs.build-go.result == 'success' || needs.build-go.result == 'skipped') &&
      (needs.build-ipk.result == 'success' || needs.build-ipk.result == 'skipped') &&
      (
        needs.detect.outputs.bypass == 'true' ||
        needs.detect.outputs.ipk == 'true' ||
        needs.detect.outputs.go_source == 'true' ||
        inputs.force_deploy == true
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d ' \r\n\t' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "SSH key OK"
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # ── Только bypass-файлы ────────────────────────────────────────────────
      - name: Deploy bypass lists only
        if: needs.detect.outputs.bypass == 'true' && needs.detect.outputs.ipk == 'false'
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' << 'ENDSSH'
          set -e
          cd /root/router && git pull
          cp files/bypass_ips.txt files/bypass_domains.txt /var/www/self-music.online/router/
          echo "bypass lists updated"
          ENDSSH

      # ── IPK ───────────────────────────────────────────────────────────────
      - name: Download IPK artifact
        if: needs.build-ipk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: router-ipk
          path: ${{ runner.temp }}

      - name: Upload + deploy IPK
        if: needs.build-ipk.result == 'success'
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/router.ipk" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/router.ipk"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' << 'ENDSSH'
          set -e
          cd /root/router && git pull
          SKIP_IPK_BUILD=1 bash files/deploy.sh
          ENDSSH

      # ── vpnd бинарники ─────────────────────────────────────────────────────
      - name: Download vpnd artifacts
        if: needs.build-go.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: vpnd-binaries
          path: ${{ runner.temp }}/dist

      - name: Upload + deploy vpnd to CDN
        if: needs.build-go.result == 'success'
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -r \
            "$RUNNER_TEMP/dist/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/vpnd-dist"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' << 'ENDSSH'
          set -e
          cd /root/router && git pull
          bash files/deploy-vpnd.sh /tmp/vpnd-dist
          rm -rf /tmp/vpnd-dist
          ENDSSH

      # ── Smoke test ─────────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          echo "Testing endpoints..."
          curl -sf --max-time 10 -o /dev/null \
            "https://${{ secrets.SSH_HOST }}/router.ipk" && echo "  ✓ router.ipk"
          curl -sf --max-time 10 -o /dev/null \
            "https://${{ secrets.SSH_HOST }}/packages/latest/armv7/vpnd" && echo "  ✓ vpnd armv7"
          curl -sf --max-time 10 -o /dev/null \
            "https://${{ secrets.SSH_HOST }}/packages/latest/aarch64_cortex-a53/vpnd" && echo "  ✓ vpnd aarch64"
          curl -sf --max-time 10 -o /dev/null \
            "https://${{ secrets.SSH_HOST }}/packages/latest/mipsel_24kc/vpnd" && echo "  ✓ vpnd mipsle"
